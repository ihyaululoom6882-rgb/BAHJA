<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHJA - DAWA FEST</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@400;700;900&family=Open+Sans:wght@400;700&family=Poppins:wght@400;600;800&family=Roboto:wght@400;700&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js" defer></script>
    <style>
        :root[data-theme="dark"] {
            --bg-mesh: radial-gradient(circle at 20% 20%, #2a2d32 0%, #111315 100%);
            --glass-card-bg: rgba(255, 255, 255, 0.05);
            --glass-card-border: rgba(255, 255, 255, 0.12);
            --glass-modal-bg: rgba(28, 30, 34, 0.95);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.15);
            --input-bg: rgba(0, 0, 0, 0.4);
            --btn-gold: linear-gradient(180deg, #e6c875 0%, #d4af37 50%, #aa820a 100%);
            --btn-gold-text: #1e1e1e;
        }
        :root[data-theme="light"] {
            --bg-mesh: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 100%);
            --glass-card-bg: rgba(255, 255, 255, 0.9);
            --glass-card-border: rgba(0, 0, 0, 0.1);
            --glass-modal-bg: rgba(255, 255, 255, 0.98);
            --text-main: #0f172a;
            --text-sub: #475569;
            --border-color: rgba(0, 0, 0, 0.15);
            --input-bg: #ffffff;
            --btn-gold: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
            --btn-gold-text: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--main-font, 'Poppins', sans-serif); }
        
        body { 
            background: var(--bg-mesh); 
            background-attachment: fixed;
            color: var(--text-main); 
            padding-bottom: 50px; 
            min-height: 100vh;
            position: relative; 
            transition: background 0.3s ease, color 0.3s ease;
        }
        @media (max-width: 899px) {
            body { background-attachment: scroll; }
            .card, .dots-btn, .dropdown-menu {
                -webkit-backdrop-filter: none;
                backdrop-filter: none;
            }
        }
        .corner-logo { 
            display: none; 
            object-fit: contain;
            transition: all 0.3s ease;
        }
        @media(max-width: 899px) {
            .corner-logo {
                position: relative !important;
                top: 0 !important;
                left: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
                transform: none !important;
                margin: 25px auto 10px auto !important;
            }
            .header-title {
                padding: 10px 20px 15px 20px !important;
            }
        }
        @media(min-width: 900px) {
            .corner-logo {
                position: fixed;
                z-index: 99;
            }
            .logo-top-left { top: 15px; left: 15px; }
            .logo-top-right { top: 15px; right: 75px; }
            .logo-bottom-left { bottom: 15px; left: 15px; }
            .logo-bottom-right { bottom: 15px; right: 15px; }
            .logo-top-center { top: 15px; left: 50%; transform: translateX(-50%); }
        }
        .header-title { text-align: var(--header-align, center); padding: 30px 20px 15px 20px; }
        .header-title p { font-size: 1.1rem; margin-bottom: 6px; font-weight: 700; letter-spacing: 3px; color: var(--text-sub); }
        .header-title h1 { font-size: 2.8rem; font-weight: 900; letter-spacing: 2px; color: var(--text-main); text-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .menu-btn-container { position: fixed; top: 15px; right: 15px; z-index: 1000; }
        .dots-btn { 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-card-border); 
            width: 44px; height: 44px; 
            border-radius: 50%; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 1.2rem; color: var(--text-main);
        }
        
        .dropdown-menu { 
            display: none; position: absolute; right: 0; top: 55px; 
            background: var(--glass-modal-bg); 
            backdrop-filter: blur(20px);
            min-width: 230px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            border-radius: 18px; overflow: hidden; z-index: 1001; 
            border: 1px solid var(--glass-card-border);
        }
        .dropdown-menu.show { display: block; }
        .dropdown-menu button { 
            width: 100%; padding: 13px 18px; border: none; background: none; 
            text-align: left; cursor: pointer; font-size: 0.9rem; color: var(--text-main); 
            display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-color); font-weight: 600; 
        }
        .dropdown-menu button:hover { background-color: rgba(255,255,255,0.1); }
        
        .container { max-width: 460px; margin: 10px auto; padding: 0 12px; }
        @media(min-width: 900px) {
            .container { max-width: 950px; }
        }
        
        .card { 
            background: var(--glass-card-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px; 
            padding: 24px 20px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1); 
            margin-bottom: 20px; 
            border: 1px solid var(--glass-card-border); 
        }
        
        .view-panel { display: none; }
        .active-panel { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; color: var(--text-sub); }
        .form-control { 
            width: 100%; padding: 12px 14px; 
            background: var(--input-bg);
            border: 1px solid var(--border-color); 
            border-radius: 12px; outline: none; font-size: 0.95rem; color: var(--text-main);
        }
        
        .btn { 
            background: var(--btn-gold); color: var(--btn-gold-text); border: none; 
            padding: 12px 20px; border-radius: 14px; cursor: pointer; 
            font-weight: 800; font-size: 0.95rem; display: inline-block; text-align: center; transition: 0.2s; 
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-block { width: 100%; }
        .btn-danger { background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); color: white; }
        .btn-success { background: linear-gradient(180deg, #10b981 0%, #047857 100%); color: white; }
        .btn-warning { background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 8px; }
        
        .result-menu-box { display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }
        .pill-menu-btn { 
            display: flex; align-items: center; justify-content: space-between; 
            border: none; padding: 16px 20px; border-radius: 50px; cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .pill-menu-btn:active { transform: scale(0.98); }
        .pill-left-content { display: flex; align-items: center; gap: 14px; }
        .pill-icon-circle { 
            width: 44px; height: 44px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 1.2rem; background: rgba(255,255,255,0.85); 
        }
        .pill-text-wrapper { text-align: left; }
        .pill-title { font-size: 1.1rem; font-weight: 800; color: #0f172a; line-height: 1.2; }
        .pill-desc { font-size: 0.78rem; color: #475569; font-weight: 500; margin-top: 3px; }
        .pill-arrow { font-size: 1.1rem; color: #334155; }
        .pill-green { background-color: #e2ebd8; } .pill-green .pill-icon-circle { color: #355e3b; }
        .pill-yellow { background-color: #f7edd4; } .pill-yellow .pill-icon-circle { color: #b45309; }
        .pill-pink { background-color: #fdf0ed; } .pill-pink .pill-icon-circle { color: #be123c; }
        .pill-blue { background-color: #e0f2fe; } .pill-blue .pill-icon-circle { color: #0369a1; }
        .pill-purple { background-color: #f3e8ff; } .pill-purple .pill-icon-circle { color: #7e22ce; }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; color: var(--text-main); }
        th { background-color: rgba(255, 255, 255, 0.05); font-weight: 700; color: var(--text-sub); }
        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 2000; 
            justify-content: center; align-items: center; padding: 15px;
        }
        .modal-box { 
            background: var(--glass-modal-bg); 
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-card-border);
            width: 100%; max-width: 440px; padding: 20px; 
            border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); 
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .collapsible-box { display: none; margin-top: 10px; }
        .collapsible-box.show { display: block; }
        .collapsible-header { 
            background: rgba(255, 255, 255, 0.08); padding: 12px 16px; border-radius: 12px; 
            font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; 
            align-items: center; margin-top: 12px; border: 1px solid var(--border-color); font-size: 0.9rem;
        }

        .timer-display {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 12px;
            margin: 10px 0;
            color: #d4af37;
            border: 1px solid var(--border-color);
        }
        .timer-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body data-theme="dark">
    <!-- Dynamic Positioned Logo -->
    <img id="corner-logo-view" class="corner-logo logo-top-left" src="" alt="Logo">
    
    <div class="header-title" id="editable-header-area">
        <p id="txt-welcome-banner">WELCOME TO BAHJA FEST</p>
        <h1 id="txt-main-title">BAHJA 2026</h1>
    </div>
    <div class="menu-btn-container">
        <button class="dots-btn" onclick="toggleDropdown()"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        <div id="mainDropdown" class="dropdown-menu"></div>
    </div>
    <div class="container">
        <!-- HOME PANEL -->
        <div id="panel-home" class="view-panel active-panel card">
            <div id="home-phase-result">
                <div class="result-menu-box">
                    <button class="pill-menu-btn pill-green" onclick="openSection('panel-entry-judge')">
                        <div class="pill-left-content">
                            <div class="pill-icon-circle"><i class="fa-solid fa-gavel"></i></div>
                            <div class="pill-text-wrapper">
                                <div class="pill-title">JUDGE ENTRY</div>
                                <div class="pill-desc">Upload marks via secret code letters</div>
                            </div>
                        </div>
                        <div class="pill-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                    </button>
                    <button class="pill-menu-btn pill-yellow" onclick="openSection('panel-pointroom-copy')">
                        <div class="pill-left-content">
                            <div class="pill-icon-circle"><i class="fa-solid fa-copy"></i></div>
                            <div class="pill-text-wrapper">
                                <div class="pill-title">POINT ROOM (COPY)</div>
                                <div class="pill-desc">Assign secret code letters to students</div>
                            </div>
                        </div>
                        <div class="pill-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                    </button>
                    <button class="pill-menu-btn pill-blue" onclick="openSection('panel-pointroom')">
                        <div class="pill-left-content">
                            <div class="pill-icon-circle"><i class="fa-solid fa-trophy"></i></div>
                            <div class="pill-text-wrapper">
                                <div class="pill-title">POINT ROOM (MAIN)</div>
                                <div class="pill-desc">Main score evaluation system</div>
                            </div>
                        </div>
                        <div class="pill-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                    </button>
                </div>
            </div>
        </div>

        <!-- ENTRY JUDGE PANEL -->
        <div id="panel-entry-judge" class="view-panel card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3 style="color:#d4af37;">Entry Judge Portal</h3>
                <button class="btn btn-warning btn-sm" onclick="navHome()"><i class="fa-solid fa-arrow-left"></i> Back</button>
            </div>

            <div class="form-group">
                <label>Select Category</label>
                <select id="ej-cat-select" class="form-control" onchange="populateEjProgs()">
                    <option value="">-- Choose Category --</option>
                    <option value="GENERAL">GENERAL</option>
                    <option value="LOWER ZONE">LOWER ZONE</option>
                    <option value="MIDDLE ZONE">MIDDLE ZONE</option>
                    <option value="HIGHER ZONE">HIGHER ZONE</option>
                    <option value="SUPER ZONE">SUPER ZONE</option>
                </select>
            </div>
            <div class="form-group">
                <label>Select Program</label>
                <select id="ej-prog-select" class="form-control" onchange="loadEjParticipantsByCode()">
                    <option value="">-- Select Program --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Program Topic</label>
                <input type="text" id="ej-topic-display" class="form-control" placeholder="Topic details..." readonly style="color:#d4af37; font-weight:bold;">
            </div>

            <div class="form-group">
                <label>Timer Control</label>
                <div class="timer-display" id="ej-timer-display">00:00</div>
                <div class="timer-controls">
                    <button class="btn btn-success btn-sm" onclick="startEjTimer()"><i class="fa-solid fa-play"></i> Start</button>
                    <button class="btn btn-warning btn-sm" onclick="pauseEjTimer()"><i class="fa-solid fa-pause"></i> Pause</button>
                    <button class="btn btn-danger btn-sm" onclick="resetEjTimer()"><i class="fa-solid fa-rotate-left"></i> Reset</button>
                </div>
            </div>

            <h4 style="margin-top:20px; margin-bottom:10px; color:#d4af37;">Marks Entry (Secret Codes Only)</h4>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width:40%;">Code Letter</th>
                            <th style="width:60%;">Mark</th>
                        </tr>
                    </thead>
                    <tbody id="ej-candidates-inputs">
                        <tr><td colspan="2" style="text-align:center;">Select a program to load code letters.</td></tr>
                    </tbody>
                </table>
            </div>
            <button class="btn btn-success btn-block" style="margin-top:15px;" onclick="saveEjMarksOnly()">Submit & Sync Judge Marks</button>
        </div>

        <!-- POINTROOM PORTAL DUPLICATE (CODE LETTER MANAGER WITH SEARCH) -->
        <div id="panel-pointroom-copy" class="view-panel card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3>Pointroom (Copy) - Code Letter Assignment</h3>
                <button class="btn btn-warning btn-sm" onclick="navHome()"><i class="fa-solid fa-arrow-left"></i> Back</button>
            </div>
            
            <div class="form-group">
                <label>Select Category</label>
                <select id="pt-cat-select-copy" class="form-control" onchange="populatePtProgsCopy()">
                    <option value="">-- Choose Category --</option>
                    <option value="GENERAL">GENERAL</option>
                    <option value="LOWER ZONE">LOWER ZONE</option>
                    <option value="MIDDLE ZONE">MIDDLE ZONE</option>
                    <option value="HIGHER ZONE">HIGHER ZONE</option>
                    <option value="SUPER ZONE">SUPER ZONE</option>
                </select>
            </div>

            <div class="form-group">
                <label>Search & Select Program</label>
                <input type="text" id="pt-prog-search-copy" class="form-control" placeholder="Search program name..." oninput="filterPtProgsCopy()" style="margin-bottom:6px;">
                <select id="pt-prog-select-copy" class="form-control" onchange="loadPtParticipantsForCodeAssignment()"></select>
            </div>

            <form onsubmit="saveCodeLettersCopy(event)" style="margin-top:12px;">
                <div id="pt-code-inputs-copy" style="margin-bottom:12px;">
                    <p style="text-align:center; color:var(--text-sub);">Select a program to assign code letters.</p>
                </div>
                <button type="submit" class="btn btn-success btn-block">Save Code Letters</button>
            </form>
        </div>

        <!-- ORIGINAL POINTROOM PORTAL -->
        <div id="panel-pointroom" class="view-panel card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3>Pointroom Management</h3>
                <button class="btn btn-warning btn-sm" onclick="navHome()"><i class="fa-solid fa-arrow-left"></i> Back</button>
            </div>
            
            <form onsubmit="savePointroomEntry(event)" style="margin-top:12px;">
                <div class="form-group">
                    <label>Select Category</label>
                    <select id="pt-cat-select" class="form-control" onchange="populatePtProgs()" required>
                        <option value="">-- Choose Category --</option>
                        <option value="GENERAL">GENERAL</option>
                        <option value="LOWER ZONE">LOWER ZONE</option>
                        <option value="MIDDLE ZONE">MIDDLE ZONE</option>
                        <option value="HIGHER ZONE">HIGHER ZONE</option>
                        <option value="SUPER ZONE">SUPER ZONE</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Select Program</label>
                    <select id="pt-prog-select" class="form-control" onchange="loadPtParticipants()" required></select>
                </div>
                
                <div id="pt-candidates-inputs" style="margin-bottom:12px;"></div>
                <button type="submit" class="btn btn-success btn-block">Submit Point Records</button>
            </form>
            <div class="collapsible-header" onclick="toggleAccordion('box-pt-list')"><span>Point Evaluation Logs</span> <i class="fa-solid fa-chevron-down"></i></div>
            <div id="box-pt-list" class="collapsible-box show"></div>
        </div>
    </div>

    <!-- MAIN APP JAVASCRIPT -->
    <script>
        // System initial state
        window.appState = {
            theme: 'dark',
            programs: [
                { id: 'p1', name: 'Elocution English', cat: 'HIGHER ZONE', topic: 'Impact of AI in Modern Education' },
                { id: 'p2', name: 'Qur-an Recitation', cat: 'LOWER ZONE', topic: 'Surah Al-Kahf (1-20)' },
                { id: 'p3', name: 'Essay Writing', cat: 'SUPER ZONE', topic: 'Sustainable Future & Green Energy' }
            ],
            registrations: [
                { progId: 'p1', team: 'Amaan', participants: ['Muhammed Shan', 'Rashid K'] },
                { progId: 'p1', team: 'Badr', participants: ['Fahiz', 'Anas V'] },
                { progId: 'p2', team: 'Amaan', participants: ['Zayan'] }
            ],
            points: []
        };

        // Navigation
        window.openSection = function(id) {
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active-panel'));
            const target = document.getElementById(id);
            if(target) target.classList.add('active-panel');
        }
        window.navHome = function() {
            openSection('panel-home');
        }
        window.toggleDropdown = function() {
            document.getElementById('mainDropdown').classList.toggle('show');
        }
        window.toggleAccordion = function(id) {
            const el = document.getElementById(id);
            if(el) el.classList.toggle('show');
        }

        /* --- ENTRY JUDGE FUNCTIONS --- */
        window.populateEjProgs = function() {
            const cat = document.getElementById('ej-cat-select').value;
            const drop = document.getElementById('ej-prog-select');
            const matched = window.appState.programs.filter(p => p.cat === cat).sort((a,b)=>a.name.localeCompare(b.name));
            drop.innerHTML = '<option value="">-- Select Program --</option>' + matched.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            document.getElementById('ej-candidates-inputs').innerHTML = '<tr><td colspan="2" style="text-align:center;">Select a program to load code letters.</td></tr>';
            document.getElementById('ej-topic-display').value = '';
        }

        window.loadEjParticipantsByCode = function() {
            const progId = document.getElementById('ej-prog-select').value;
            const targetProg = window.appState.programs.find(p => p.id === progId);
            const container = document.getElementById('ej-candidates-inputs');
            if(!targetProg) { container.innerHTML = '<tr><td colspan="2" style="text-align:center;">Select a program.</td></tr>'; return; }
            
            document.getElementById('ej-topic-display').value = targetProg.topic || `Topic for ${targetProg.name}`;

            const matchedRegs = window.appState.registrations.filter(r => r.progId === progId);
            let codeLettersList = [];
            matchedRegs.forEach(r => {
                r.participants.forEach(pName => {
                    const savedPt = window.appState.points.find(pt => pt.progId === progId && pt.team === r.team && pt.student === pName) || { score: 0, codeLetter: '' };
                    if(savedPt.codeLetter) {
                        codeLettersList.push({
                            codeLetter: savedPt.codeLetter,
                            team: r.team,
                            student: pName,
                            score: savedPt.score
                        });
                    }
                });
            });

            if(codeLettersList.length === 0) {
                container.innerHTML = '<tr><td colspan="2" style="text-align:center; color:#f59e0b;">No Code Letters assigned yet in Pointroom (Copy).</td></tr>';
                return;
            }

            codeLettersList.sort((a,b) => a.codeLetter.localeCompare(b.codeLetter));

            container.innerHTML = codeLettersList.map(item => `
                <tr>
                    <td><strong style="color:#d4af37; font-size:1.1rem;">Code: ${item.codeLetter}</strong></td>
                    <td><input type="number" min="0" class="form-control ej-score-only-field" data-team="${item.team}" data-student="${item.student}" data-code="${item.codeLetter}" value="${item.score}"></td>
                </tr>
            `).join('');
        }

        window.saveEjMarksOnly = function() {
            const progId = document.getElementById('ej-prog-select').value;
            const cat = document.getElementById('ej-cat-select').value;
            if(!progId || !cat) { alert("Please select category and program."); return; }

            const scoreInputs = document.querySelectorAll('.ej-score-only-field');
            if(scoreInputs.length === 0) { alert("No entries to submit."); return; }

            scoreInputs.forEach(f => {
                const team = f.getAttribute('data-team');
                const student = f.getAttribute('data-student');
                const codeLetter = f.getAttribute('data-code');
                const score = parseFloat(f.value) || 0;

                let existing = window.appState.points.find(pt => pt.progId === progId && pt.team === team && pt.student === student);
                if(existing) {
                    existing.score = score;
                    existing.codeLetter = codeLetter;
                } else {
                    window.appState.points.push({ progId, cat, team, student, score, codeLetter });
                }
            });

            alert("Judge Marks Updated & Synced to Main Point Room!");
            renderPtList();
        }

        /* --- TIMER --- */
        let ejTimerInterval = null;
        let ejSeconds = 0;
        window.updateEjTimerDisplay = function() {
            const mins = String(Math.floor(ejSeconds / 60)).padStart(2, '0');
            const secs = String(ejSeconds % 60).padStart(2, '0');
            document.getElementById('ej-timer-display').innerText = `${mins}:${secs}`;
        }
        window.startEjTimer = function() {
            if (ejTimerInterval) return;
            ejTimerInterval = setInterval(() => {
                ejSeconds++;
                updateEjTimerDisplay();
            }, 1000);
        }
        window.pauseEjTimer = function() {
            clearInterval(ejTimerInterval);
            ejTimerInterval = null;
        }
        window.resetEjTimer = function() {
            pauseEjTimer();
            ejSeconds = 0;
            updateEjTimerDisplay();
        }

        /* --- POINTROOM (COPY) CODE LETTER ASSIGNMENT --- */
        window.populatePtProgsCopy = function() {
            const cat = document.getElementById('pt-cat-select-copy').value;
            const searchInput = document.getElementById('pt-prog-search-copy').value.toLowerCase().trim();
            const drop = document.getElementById('pt-prog-select-copy');
            
            const matched = window.appState.programs
                .filter(p => p.cat === cat)
                .filter(p => !searchInput || p.name.toLowerCase().includes(searchInput))
                .sort((a,b)=>a.name.localeCompare(b.name));
                
            drop.innerHTML = '<option value="">-- Choose Program --</option>' + matched.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            document.getElementById('pt-code-inputs-copy').innerHTML = '<p style="text-align:center; color:var(--text-sub);">Select a program to assign code letters.</p>';
        }

        window.filterPtProgsCopy = function() {
            populatePtProgsCopy();
        }

        window.loadPtParticipantsForCodeAssignment = function() {
            const progId = document.getElementById('pt-prog-select-copy').value;
            const container = document.getElementById('pt-code-inputs-copy');
            if(!progId) { container.innerHTML = '<p style="text-align:center; color:var(--text-sub);">Select a program.</p>'; return; }

            const matchedRegs = window.appState.registrations.filter(r => r.progId === progId);
            if(matchedRegs.length === 0) {
                container.innerHTML = '<p style="color:#ef4444; text-align:center;">No candidates registered for this program.</p>';
                return;
            }

            let html = '';
            matchedRegs.forEach(r => {
                r.participants.forEach(pName => {
                    const savedPt = window.appState.points.find(pt => pt.progId === progId && pt.team === r.team && pt.student === pName) || { codeLetter: '' };
                    html += `
                        <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.2); padding:8px 10px; margin-bottom:6px; border-radius:8px; border:1px solid var(--border-color);">
                            <span><strong>${pName}</strong> (${r.team})</span>
                            <input type="text" class="form-control pt-code-assign-field" data-team="${r.team}" data-student="${pName}" value="${savedPt.codeLetter || ''}" placeholder="Code (e.g. A)" style="width:110px; text-transform:uppercase;">
                        </div>
                    `;
                });
            });
            container.innerHTML = html;
        }

        window.saveCodeLettersCopy = function(e) {
            e.preventDefault();
            const progId = document.getElementById('pt-prog-select-copy').value;
            const cat = document.getElementById('pt-cat-select-copy').value;
            if(!progId || !cat) { alert("Please select Category & Program."); return; }

            document.querySelectorAll('.pt-code-assign-field').forEach(f => {
                const team = f.getAttribute('data-team');
                const student = f.getAttribute('data-student');
                const codeLetter = f.value.toUpperCase().trim();

                let existing = window.appState.points.find(pt => pt.progId === progId && pt.team === team && pt.student === student);
                if(existing) {
                    existing.codeLetter = codeLetter;
                } else {
                    window.appState.points.push({ progId, cat, team, student, score: 0, codeLetter });
                }
            });

            alert("Code Letters Saved Successfully!");
        }

        /* --- MAIN POINTROOM --- */
        window.populatePtProgs = function() {
            const cat = document.getElementById('pt-cat-select').value;
            const drop = document.getElementById('pt-prog-select');
            const matched = window.appState.programs.filter(p => p.cat === cat).sort((a,b)=>a.name.localeCompare(b.name));
            drop.innerHTML = '<option value="">-- Choose Program --</option>' + matched.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            document.getElementById('pt-candidates-inputs').innerHTML = '';
        }

        window.loadPtParticipants = function() {
            const progId = document.getElementById('pt-prog-select').value;
            const container = document.getElementById('pt-candidates-inputs');
            if(!progId) { container.innerHTML = ''; return; }
            const matchedRegs = window.appState.registrations.filter(r => r.progId === progId);
            let html = '';
            matchedRegs.forEach(r => {
                r.participants.forEach(pName => {
                    const savedPt = window.appState.points.find(pt => pt.progId === progId && pt.team === r.team && pt.student === pName) || { score: 0 };
                    html += `
                        <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.2); padding:8px 10px; margin-bottom:6px; border-radius:8px; border:1px solid var(--border-color);">
                            <span><strong>${pName}</strong> (${r.team})</span>
                            <input type="number" min="0" class="form-control pt-score-field" data-team="${r.team}" data-student="${pName}" value="${savedPt.score}" style="width:80px; padding:6px;">
                        </div>
                    `;
                });
            });
            container.innerHTML = html;
        }

        window.savePointroomEntry = function(e) {
            e.preventDefault();
            const progId = document.getElementById('pt-prog-select').value;
            const cat = document.getElementById('pt-cat-select').value;
            if(!progId || !cat) return;

            document.querySelectorAll('.pt-score-field').forEach(f => {
                const score = parseFloat(f.value) || 0;
                const team = f.getAttribute('data-team');
                const student = f.getAttribute('data-student');

                let existing = window.appState.points.find(pt => pt.progId === progId && pt.team === team && pt.student === student);
                if(existing) {
                    existing.score = score;
                } else {
                    window.appState.points.push({ progId, cat, team, student, score, codeLetter:'' });
                }
            });
            alert("Points recorded.");
            renderPtList();
        }

        function renderPtList() {
            const container = document.getElementById('box-pt-list');
            const distinctProgs = [...new Set(window.appState.points.map(p => p.progId))];
            if(distinctProgs.length === 0) {
                if(container) container.innerHTML = '<p>No marks processed.</p>';
                return; 
            }
            const htmlContent = distinctProgs.map(pid => {
                const prog = window.appState.programs.find(p => p.id === pid) || { name: 'Unknown', cat: 'N/A' };
                const subPts = window.appState.points.filter(pt => pt.progId === pid).sort((a,b)=>b.score - a.score);
                return `
                    <div style="background:rgba(0,0,0,0.2); border:1px solid var(--border-color); padding:10px; border-radius:8px; margin-bottom:6px;">
                        <div>
                            <strong>${prog.name} (${prog.cat})</strong>
                        </div>
                        <div style="font-size:0.88rem; color:var(--text-sub); margin-top:4px;">
                            ${subPts.map(s => `${s.student} (${s.team}) [Code:${s.codeLetter||'N/A'}]: <strong style="color:#d4af37;">${s.score}</strong>`).join('<br>')}
                        </div>
                    </div>
                `;
            }).join('');

            if(container) container.innerHTML = htmlContent;
        }
    </script>
</body>
</html>
