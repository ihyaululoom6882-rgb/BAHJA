        // Client-side image compressor utility (Drastically reduces database payload)
        function compressImage(file, maxWidth = 1000, quality = 0.7) {
            return new Promise((resolve) => {
                if (!file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        window.saveRegistrationItem = function(progId, cat) {
            if(!window.appState.portalOpen) { alert("Registration Locked!"); return; }
            const fields = document.querySelectorAll(`.prog-input-${progId}`);
            const names = Array.from(fields).map(f => f.value.trim()).filter(n => n !== '');
            if(cat !== 'GENERAL') {
                for (let sName of names) {
                    const matchCount = window.appState.registrations.filter(r => r.team === window.loggedTeamUser && r.cat !== 'GENERAL' && r.progId !== progId && r.participants.includes(sName)).length;
                    if(matchCount >= window.appState.maxProgLimit) {
                        alert(`Limit violation! Student "${sName}" already registered for ${matchCount} items.`);
                        return;
                    }
                }
            }
            window.appState.registrations = window.appState.registrations.filter(r => !(r.team === window.loggedTeamUser && r.progId === progId));
            if(names.length > 0) window.appState.registrations.push({ team: window.loggedTeamUser, cat, progId, participants: names });
            saveData(); alert("Registration updated.");
        }

        window.renderJudgeLeaderboard = function() {
            const tbody = document.getElementById('judge-leaderboard-body');
            if(!tbody) return;
            const filterStage = document.getElementById('jd-filter-stage').value;
            const aggregate = {};
            window.appState.points.forEach(pt => {
                if(pt.cat === 'GENERAL') return;
                const prog = window.appState.programs.find(p => p.id === pt.progId);
                if(!prog) return;
                if(filterStage !== 'all' && prog.stage !== filterStage) return;
                const key = `${pt.team}_${pt.student}`;
                if(!aggregate[key]) aggregate[key] = { name: pt.student, team: pt.team, cat: pt.cat, total: 0 };
                aggregate[key].total += pt.score;
            });
            const sorted = Object.values(aggregate).sort((a,b) => b.total - a.total);
            tbody.innerHTML = sorted.map(s => `
                <tr onclick="viewCandidateBreakdown('${s.name}', '${s.team}')" style="cursor:pointer;">
                    <td><strong>${s.name}</strong></td>
                    <td>${s.team}</td>
                    <td>${s.cat}</td>
                    <td><strong style="color:#d4af37;">${s.total}</strong></td>
                </tr>
            `).join('') || '<tr><td colspan="4">No scores accumulated.</td></tr>';
        }

            let rows = '';
            let count = 1;
            window.appState.registrations.forEach(r => {
                const p = window.appState.programs.find(pr => pr.id === r.progId);
                if(!p) return;
                if(fTeam && r.team !== fTeam) return;
                if(fCat && r.cat !== fCat) return;
                if(fProg && r.progId !== fProg) return;
                r.participants.forEach(name => {
                    rows += `<tr>
                        <td style="text-align:center;">${count++}</td>
                        <td><strong>${name}</strong></td>
                        <td>${r.team}</td>
                        <td>${r.cat}</td>
                        <td>${p.name}</td>
                    </tr>`;
                });
            });
            tbody.innerHTML = rows || '<tr><td colspan="5" style="text-align:center;">No entries found.</td></tr>';
        }

        function renderResultPhaseFeeds() {
            const statusBox = document.getElementById('team-status-poster-box');
            if(window.appState.teamStatusUrl) {
                statusBox.innerHTML = `
                    <div style="max-width:500px; margin: 0 auto; text-align:center;">
                        <img src="${window.appState.teamStatusUrl}" style="width:100%; border-radius:14px;" loading="lazy">
                        <div style="margin-top:10px;"><a href="${window.appState.teamStatusUrl}" download="Team_Status.png" class="btn btn-sm"><i class="fa-solid fa-download"></i> Download Poster</a></div>
                    </div>`;
            } else statusBox.innerHTML = '<p>No Team Status published.</p>';
            filterResultPrograms();
            renderPinterestUpdates('all');
            document.getElementById('livelink-feed').innerHTML = window.appState.livelinks.map(l => `
                <div class="masonry-item">
                    <img src="${l.thumb}" loading="lazy">
                    <h5 style="margin-top:6px; font-size:0.9rem;">${l.title}</h5>
                    <a href="${l.url}" target="_blank" class="btn btn-sm btn-danger btn-block" style="margin-top:6px;"><i class="fa-solid fa-play"></i> Watch Stream</a>
                </div>
            `).join('') || '<p style="grid-column: 1/-1;">No Active Live Streams.</p>';
            document.getElementById('highlights-feed').innerHTML = window.appState.highlights.map(h => `
                <div class="masonry-item">
                    <img src="${h.thumb}" loading="lazy">
                    <h5 style="margin-top:6px; font-size:0.9rem;">${h.title}</h5>
                    <a href="${h.url}" target="_blank" class="btn btn-sm btn-block" style="margin-top:6px;"><i class="fa-solid fa-arrow-up-right-from-square"></i> Open</a>
                </div>
            `).join('') || '<p style="grid-column: 1/-1;">No Highlights Cataloged.</p>';
        }

        window.filterResultPrograms = function() {
            const cat = document.getElementById('res-search-cat').value;
            const searchQ = document.getElementById('res-prog-search').value.toLowerCase().trim();
            const container = document.getElementById('results-display-list');
            const matchedResults = window.appState.results.filter(r => {
                const p = window.appState.programs.find(pr => pr.id === r.progId);
                if(!p) return false;
                if(cat && p.cat !== cat) return false;
                if(searchQ && !p.name.toLowerCase().includes(searchQ)) return false;
                return true;
            });
            container.innerHTML = matchedResults.map(r => {
                const p = window.appState.programs.find(pr => pr.id === r.progId) || { name: 'Program', cat: 'N/A' };
                return `
                    <div style="background:rgba(0,0,0,0.2); padding:14px; border:1px solid var(--border-color); margin-bottom:10px; border-radius:16px;">
                        <h4>${p.name} <span style="font-size:0.75rem; color:var(--text-sub);">(${p.cat})</span> - <span style="color:#d4af37;">Result ${r.number || ''}</span></h4>
                        <div style="margin-top:8px;">
                            <button class="btn btn-sm btn-success" id="btn-toggle-res-${r.progId}" onclick="toggleInlineResultView('${r.progId}', '${r.poster}')">Result View</button>
                            <div id="inline-res-box-${r.progId}" style="display:none; margin-top:10px; text-align:center;"></div>
                            ${r.youtube ? `<div style="margin-top:6px;"><a href="${r.youtube}" target="_blank" class="btn btn-sm btn-danger"><i class="fa-brands fa-youtube"></i> Watch Video</a></div>` : ''}
                        </div>
                    </div>
                `;
            }).join('') || '<p style="text-align:center; color:var(--text-sub); margin-top:15px;">No published results matching filter.</p>';
        }

        window.toggleInlineResultView = function(progId, posterData) {
            const box = document.getElementById(`inline-res-box-${progId}`);
            const btn = document.getElementById(`btn-toggle-res-${progId}`);
            if(box.style.display === 'none') {
                confetti({ particleCount: 70, spread: 50, origin: { y: 0.6 } });
                box.innerHTML = `
                    <img src="${posterData}" style="width:100%; border-radius:10px;" loading="lazy">
                    <div style="margin-top:8px;"><a href="${posterData}" download="Result_${progId}.png" class="btn btn-sm"><i class="fa-solid fa-download"></i> Download Poster</a></div>
                `;
                box.style.display = 'block';
                btn.innerText = "Hide Result";
                btn.className = "btn btn-sm btn-danger";
            } else {
                box.style.display = 'none';
                box.innerHTML = '';
                btn.innerText = "Result View";
                btn.className = "btn btn-sm btn-success";
            }
        }

        window.renderPinterestUpdates = function(filterMode) {
            const feed = document.getElementById('live-updates-feed');
            if(!feed) return;
            const targetUpdates = window.appState.updates.filter(u => filterMode === 'all' || u.type === filterMode);
            feed.innerHTML = targetUpdates.map(u => `
                <div class="masonry-item">
                    ${u.type === 'photo' ? `<img src="${u.url}" loading="lazy">` : `<video src="${u.url}" controls playsinline preload="metadata"></video>`}
                    <h5 style="margin-top:6px; font-size:0.85rem; font-weight:700;">${u.title}</h5>
                </div>
            `).join('') || '<p style="grid-column: 1/-1;">No updates cataloged.</p>';
        }

        render3DotMenu();
    </script>
</body>
</html>
